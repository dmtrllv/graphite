<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" href="/icon.png">
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Graphite</title>
		<style>
			:root {
				--bg-1: rgb(32, 32, 32);
				--bg-2: rgb(54, 54, 54);
				--bg-3: rgb(20, 20, 20);
				--bg-4: rgb(42, 42, 42);
				--fg-1: rgb(236, 236, 236);
				--fg-2: rgb(184, 184, 184);
				--border-1: rgb(73, 73, 73);
				--border-2: rgb(46, 46, 46);
				--accent-1: rgb(0, 183, 255);
			}

			* {
				box-sizing: border-box;
			}

			html,
			body,
			#root {
				margin: 0;
				padding: 0;
				width: 100vw;
				height: 100vh;
				color: var(--fg-1);
				overflow: hidden;
				font-family: sans-serif;
				background-color: black;
				user-select: none;
			}

			input {
				background-color: var(--bg-2);
				border-radius: 6px;
				border: 1px solid var(--border-1);
				color: var(--fg-1);
				outline: none;
				padding: 5px;
				width: 100px;
				display: inline-block;

				&:disabled {
					opacity: 0.2;
					user-select: none;
					pointer-events: none;
				}

				&::-webkit-outer-spin-button,
				&::-webkit-inner-spin-button {
					-webkit-appearance: none;
					appearance: none;
					margin: 0;
				}

				&[type="number"] {
					appearance: textfield;
					-moz-appearance: textfield;
				}
			}

			input,
			select {
				background-color: var(--bg-2);
				border: 1px solid var(--border-1);
				border-radius: 4px;
				color: var(--fg-1);
				padding: 2px 5px;
				outline: none;
			}

			button {
				background-color: var(--bg-2);
				border: 1px solid var(--border-1);
				border-radius: 4px;
				color: var(--fg-1);
				cursor: pointer;
				padding: 4px 8px;
			}

			::-webkit-scrollbar {
				width: 8px;
				margin: 2px;
				border-radius: 4px;
			}

			::-webkit-scrollbar-track {
				background-color: rgba(255, 255, 255, 0.01);
				border-radius: 4px;

				&:hover {
					background-color: rgba(255, 255, 255, 0.2) !important;
				}
			}

			::-webkit-scrollbar-thumb {
				background-color: rgba(255, 255, 255, 0.05);
				border-radius: 4px;

				&:hover {
					background-color: rgba(255, 255, 255, 0.5) !important;
				}
			}

			*:hover {
				>::-webkit-scrollbar-track {
					background-color: rgba(255, 255, 255, 0.05);
					border-radius: 4px;
				}

				>::-webkit-scrollbar-thumb {
					background-color: rgba(255, 255, 255, 0.164);
					border-radius: 4px;
				}
			}
		</style>
		<script>
			// polyfills :/
			Symbol.metadata ??= Symbol.for("Symbol.metadata");
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/index.tsx"></script>
	</body>
</html>
